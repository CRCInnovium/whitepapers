<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} — InnoviumAI</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header>
  <a href="{{ '/' | relative_url }}" aria-label="InnoviumAI research home"><img class="logo" src="{{ '/assets/innovium-logo-color.svg' | relative_url }}" alt="InnoviumAI" width="166"></a>
  <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Publications</a><a href="https://github.com/CRCInnovium/whitepapers">GitHub ↗</a></nav>
</header>
{{ content }}
<footer><span>InnoviumAI · Technology Innovation Institute · Abu Dhabi</span><span>© 2026 · All rights reserved</span></footer>
</body>
</html>
